name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create local environment for compilation
        run: cp src/env/env.prod.ts src/env/env.ts
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
      - name: Check PHP and web security regressions
        run: |
          php -l deploy/web/index.php
          php -l deploy/web/server-storage.php
          php tests/web-security.php
          php -d disable_functions=curl_init tests/web-security.php
          php tests/shared-storage.php
      - name: Validate production Compose
        env:
          CLOUDFLARE_TUNNEL_TOKEN: configuration-validation-only
          SFTOOLS_PASSWORD: configuration-validation-only
        run: docker compose -f docker-compose.prod.yml config --quiet
