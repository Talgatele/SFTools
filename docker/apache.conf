<Directory /var/www/html>
	AllowOverride All
	Require all granted
</Directory>

# Bound PHP/prefork concurrency for small containers. Static assets do not need
# hundreds of PHP-capable processes; queued requests can reuse these workers.
<IfModule mpm_prefork_module>
	StartServers 5
	MinSpareServers 5
	MaxSpareServers 10
	ServerLimit 64
	MaxRequestWorkers 64
	MaxConnectionsPerChild 10000
</IfModule>

# Release workers promptly between asset requests.
KeepAliveTimeout 2
