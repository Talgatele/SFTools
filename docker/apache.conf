<Directory /var/www/html>
	AllowOverride All
	Require all granted
</Directory>

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "DENY"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
	Header always set Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'"
</IfModule>

# Bound PHP/prefork concurrency for small containers. Static assets do not need
# hundreds of PHP-capable processes; queued requests can reuse these workers.
<IfModule mpm_prefork_module>
	StartServers 5
	MinSpareServers 5
	MaxSpareServers 10
	ServerLimit 64
	MaxRequestWorkers 64
	MaxConnectionsPerChild 10000
</IfModule>

# Release workers promptly between asset requests.
KeepAliveTimeout 2
