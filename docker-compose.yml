services:
  sftools:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SFTOOLS_PASSWORD: ${SFTOOLS_PASSWORD:?Set SFTOOLS_PASSWORD in .env (at least 12 characters)}
      SFTOOLS_ORIGIN: ${SFTOOLS_ORIGIN:-http://localhost:8080}
    volumes:
      - sftools-data:/var/lib/sftools
    ports:
      - "${SFTOOLS_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  sftools-data:
