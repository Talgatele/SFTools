# Standalone home-server stack. Do not merge with docker-compose.yml (it publishes a port).
services:
  sftools:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SFTOOLS_PASSWORD: ${SFTOOLS_PASSWORD:?Set SFTOOLS_PASSWORD in .env (at least 12 characters)}
      SFTOOLS_ORIGIN: https://satisfactory.bitstacker.dev
    volumes:
      - sftools-data:/var/lib/sftools
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/server-storage.php?action=session') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      sftools:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Host: satisfactory.bitstacker.dev", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      caddy:
        condition: service_healthy

volumes:
  sftools-data:
  caddy-data:
  caddy-config:
